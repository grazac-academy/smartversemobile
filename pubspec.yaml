name: smartversemobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  dotted_border: ^3.1.0
  intl: ^0.20.3
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_secure_storage: ^11.1.1
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  pdf: ^3.12.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  media_store_plus: ^0.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM_Sans/DMSans_18pt-SemiBold.ttf
        - asset: assets/fonts/DM_Sans/DMSans_18pt-Regular.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces_72pt-Black.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf